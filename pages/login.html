<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Andes Fresh</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>
</head>
<body>
    <div class="login-page">
        <!-- Parte Visual Izquierda -->
        <div class="login-image">
            <h1>Andes Fresh</h1>
            <p>Sistema Integral de Gestión de Pedidos</p>
        </div>

        <!-- Formulario Derecha -->
        <div class="login-form-container">
            <div class="login-container">
                <div class="login-logo">
                    Andes <span>Fresh</span>
                </div>
                <h2>Bienvenido de nuevo</h2>
                <p>Ingresa tus credenciales para acceder al sistema.</p>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Usuario / Correo</label>
                        <input type="email" id="email" class="form-control" placeholder="admin@andesfresh.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" class="form-control" placeholder="123" required>
                    </div>
                    <div class="form-group flex-between">
                        <label style="font-weight: normal; margin: 0; display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox"> Recordarme
                        </label>
                        <a href="#" style="font-size: 13px; color: var(--primary-color); text-decoration: none;">¿Olvidaste tu contraseña?</a>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px; font-size: 15px;">
                        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                    </button>
                    <div id="login-error" class="error-msg"></div>
                    
                    <div style="margin-top: 40px; font-size: 12px; color: var(--text-muted); text-align: left; padding-top: 20px; border-top: 1px solid var(--border-color);">
                        <p style="margin-bottom: 5px; color: var(--text-main); font-weight: 500;">Usuarios de prueba (pwd: 123):</p>
                        <p>🔹 admin@andesfresh.com</p>
                        <p>🔹 vendedor@andesfresh.com</p>
                        <p>🔹 gerencia@andesfresh.com</p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
